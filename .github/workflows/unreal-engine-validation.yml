name: Real Unreal Engine compatibility validation

on:
  workflow_dispatch:
    inputs:
      expected_version:
        description: "Expected Unreal major.minor version, for example 5.8 or 6.0"
        required: false
        type: string
      commit_results:
        description: "Commit generated API snapshots/reports back to this branch"
        required: true
        default: false
        type: boolean
      merge_if_safe:
        description: "Promote the branch when build + direct Unreal smoke + native MCP smoke + API diff are safe"
        required: true
        default: false
        type: boolean

permissions:
  contents: write
  pull-requests: write
  issues: write

concurrency:
  group: unreal-engine-validation-${{ github.ref }}
  cancel-in-progress: false

jobs:
  validate:
    runs-on: [self-hosted, Windows, X64, unreal]
    timeout-minutes: 180

    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - uses: actions/setup-python@v7
        with:
          python-version: "3.13"

      - name: Install external MCP dependencies
        run: python -m pip install -r MCP/requirements.txt

      - name: Build plugin and validate against real Unreal Editor
        id: unreal
        shell: pwsh
        run: |
          ./Automation/run_unreal_validation.ps1 -ExpectedVersion "${{ inputs.expected_version }}"

      - name: Re-run hosted-side checks
        shell: pwsh
        run: |
          python -m compileall -q MCP Automation
          Push-Location MCP
          python -m unittest tests.test_transport -v
          Pop-Location
          python -m unittest discover -s Automation/tests -v

      - name: Validation summary
        shell: pwsh
        run: |
          "### UnrealMCP real-engine validation" | Out-File $env:GITHUB_STEP_SUMMARY -Append
          "- Engine: ${{ steps.unreal.outputs.engine_version }}" | Out-File $env:GITHUB_STEP_SUMMARY -Append
          "- Plugin compile: PASS" | Out-File $env:GITHUB_STEP_SUMMARY -Append
          "- Direct Unreal API smoke: PASS" | Out-File $env:GITHUB_STEP_SUMMARY -Append
          "- Native MCP TCP bridge smoke: PASS" | Out-File $env:GITHUB_STEP_SUMMARY -Append
          "- API diff safe: ${{ steps.unreal.outputs.diff_safe }}" | Out-File $env:GITHUB_STEP_SUMMARY -Append

      - name: Commit compatibility evidence
        if: inputs.commit_results
        shell: pwsh
        run: |
          git config user.name "unrealmcp-validation-bot"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add compat/api compat/reports
          git diff --cached --quiet
          if ($LASTEXITCODE -ne 0) {
            git commit -m "chore: record Unreal ${{ steps.unreal.outputs.engine_version }} compatibility"
            git push origin "HEAD:${{ github.ref_name }}"
          }

      - name: Promote compatible automated update
        if: inputs.merge_if_safe && steps.unreal.outputs.diff_safe == 'true'
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
          ENGINE_VERSION: ${{ steps.unreal.outputs.engine_version }}
          ENGINE_MAJOR_MINOR: ${{ steps.unreal.outputs.major_minor }}
        run: |
          $branch = "${{ github.ref_name }}"
          $pr = gh pr list --head $branch --base master --state open --json number --jq '.[0].number // empty'

          if ($pr) {
            gh pr comment $pr --body "Real Unreal validation passed on UE $env:ENGINE_VERSION: plugin compiled, direct Unreal API smoke passed, the native UnrealMCP TCP bridge passed real commands, and no breaking API change referenced by UnrealMCP was detected. Merging automatically."
            gh pr merge $pr --squash --delete-branch
          } else {
            Write-Host "No PR exists because this repository may block Actions-created PRs. Promoting the fully validated branch directly."
            git fetch origin master
            git rebase origin/master
            git push origin HEAD:master
            if ($branch -ne "master") {
              git push origin --delete $branch
            }
          }

          $issueTitle = "Automation: validate Unreal $env:ENGINE_MAJOR_MINOR compatibility"
          $issue = gh issue list --state open --search "$issueTitle in:title" --json number,title --jq '.[] | select(.title == "'"$issueTitle"'") | .number' | Select-Object -First 1
          if ($issue) {
            gh issue comment $issue --body "Compatibility validation passed on UE $env:ENGINE_VERSION. Plugin compile, direct Unreal smoke, native MCP bridge smoke, and API-diff gates all passed."
            gh issue close $issue
          }

      - name: Report incompatible API diff
        if: inputs.merge_if_safe && steps.unreal.outputs.diff_safe != 'true'
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
          ENGINE_VERSION: ${{ steps.unreal.outputs.engine_version }}
          ENGINE_MAJOR_MINOR: ${{ steps.unreal.outputs.major_minor }}
        run: |
          $branch = "${{ github.ref_name }}"
          $pr = gh pr list --head $branch --base master --state open --json number --jq '.[0].number // empty'

          if ($pr) {
            gh pr comment $pr --body "The plugin compiled and both direct Unreal and native MCP smoke tests passed, but the reflected API diff contains breaking changes referenced by UnrealMCP. Automatic promotion is blocked; inspect compat/reports/."
          } else {
            "### Automatic promotion blocked" | Out-File $env:GITHUB_STEP_SUMMARY -Append
            "The plugin compiled and both smoke tests passed, but the reflected API diff references breaking changes. Branch $branch was preserved for review." | Out-File $env:GITHUB_STEP_SUMMARY -Append
          }

          $issueTitle = "Automation: validate Unreal $env:ENGINE_MAJOR_MINOR compatibility"
          $issue = gh issue list --state open --search "$issueTitle in:title" --json number,title --jq '.[] | select(.title == "'"$issueTitle"'") | .number' | Select-Object -First 1
          if ($issue) {
            gh issue comment $issue --body "UE $env:ENGINE_VERSION compiled and passed direct/native MCP smoke tests, but source-referenced breaking API changes were detected. Automatic promotion is blocked. Inspect compat/reports on branch $branch."
          }
