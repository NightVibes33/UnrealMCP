name: UnrealMCP checks

on:
  push:
    branches: ["master"]
  pull_request:

permissions:
  contents: read

jobs:
  python:
    strategy:
      matrix:
        python-version: ["3.11", "3.13"]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: ${{ matrix.python-version }}
          cache: "pip"
          cache-dependency-path: "MCP/requirements.txt"

      - run: python -m pip install -r MCP/requirements.txt
      - run: python -m compileall -q MCP Automation

      - name: Import and register complete tool surface
        run: |
          python - <<'PY'
          import sys
          sys.path.insert(0, "MCP")
          import unreal_mcp_bridge
          count = unreal_mcp_bridge.load_commands()
          assert count >= 17, count
          print(f"registered {count} command modules")
          PY

      - name: MCP transport tests
        run: |
          cd MCP
          python -m unittest tests.test_transport -v

      - name: Automation unit tests
        run: python -m unittest discover -s Automation/tests -v

      - name: Parse workflow YAML
        run: |
          ruby -e 'require "yaml"; Dir[".github/workflows/*.{yml,yaml}"].sort.each { |f| YAML.safe_load(File.read(f), aliases: true); puts "parsed #{f}" }'

      - name: Modernization guards
        run: |
          ! grep -R 'EditorStyleSet.h' Source/UnrealMCP
          ! grep -R 'EditorStaticMeshLibrary' MCP/Commands Source/UnrealMCP
          ! grep -R 'DataLayerSubsystem' MCP/Commands Source/UnrealMCP
          ! grep -R 'GEngine->Exec.*py' Source/UnrealMCP
